version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pos_erp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pos-erp-v2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pos-erp-v2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pos_erp_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-pos-erp-v2}
      - JWT_SECRET=${JWT_SECRET}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - pos_network

  frontend:
    build: ./frontend
    container_name: pos_erp_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:3000
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    ports:
      - "3001:3001"
    networks:
      - pos_network

volumes:
  postgres_data:

networks:
  pos_network:
    driver: bridge